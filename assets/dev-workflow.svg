<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wfBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="wfShadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/></filter>
  </defs>

  <!-- Card -->
  <rect x="5" y="5" width="850" height="210" rx="10" fill="#0C0C0E" stroke="url(#wfBorder)" stroke-width="1" filter="url(#wfShadow)"/>

  <!-- Phase 1 -->
  <rect x="25" y="30" width="240" height="70" rx="6" fill="#111113" stroke="#27272A" stroke-width="0.5"/>
  <text x="40" y="50" font-family="JetBrains Mono, Courier New, monospace" font-size="9" fill="#3B82F6">[PHASE 1]</text>
  <text x="40" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#FAFAFA">Blueprint &amp; Architecture</text>
  <text x="40" y="86" font-family="JetBrains Mono, monospace" font-size="8" fill="#52525B">schema → contracts → scaffolding</text>

  <!-- Arrow 1 -->
  <line x1="270" y1="65" x2="310" y2="65" stroke="#27272A" stroke-width="1"/>
  <polygon points="310,60 320,65 310,70" fill="#27272A"/>
  <circle cx="290" cy="65" r="3" fill="#3B82F6" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Phase 2 -->
  <rect x="325" y="30" width="240" height="70" rx="6" fill="#111113" stroke="#27272A" stroke-width="0.5"/>
  <text x="340" y="50" font-family="JetBrains Mono, Courier New, monospace" font-size="9" fill="#06B6D4">[PHASE 2]</text>
  <text x="340" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#FAFAFA">AI-Assisted Build</text>
  <text x="340" y="86" font-family="JetBrains Mono, monospace" font-size="8" fill="#52525B">prism → rules → context injection</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="65" x2="610" y2="65" stroke="#27272A" stroke-width="1"/>
  <polygon points="610,60 620,65 610,70" fill="#27272A"/>

  <!-- Phase 3 -->
  <rect x="625" y="30" width="210" height="70" rx="6" fill="#111113" stroke="#27272A" stroke-width="0.5"/>
  <text x="640" y="50" font-family="JetBrains Mono, Courier New, monospace" font-size="9" fill="#10B981">[PHASE 3]</text>
  <text x="640" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#FAFAFA">Zero-Cost Deploy</text>
  <text x="640" y="86" font-family="JetBrains Mono, monospace" font-size="8" fill="#52525B">vercel → edge → cloudflare</text>

  <!-- Separator -->
  <line x1="25" y1="115" x2="835" y2="115" stroke="#27272A" stroke-width="0.5"/>

  <!-- Metrics Row -->
  <text x="25" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">The Syntaxure Protocol</text>

  <!-- Metric 1 -->
  <rect x="25" y="152" width="180" height="45" rx="5" fill="#0A0A0A" stroke="#18181B" stroke-width="0.5"/>
  <text x="40" y="172" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#10B981">+260%</text>
  <text x="40" y="188" font-family="Inter, sans-serif" font-size="9" fill="#52525B">Admin Time Saved</text>

  <!-- Metric 2 -->
  <rect x="218" y="152" width="180" height="45" rx="5" fill="#0A0A0A" stroke="#18181B" stroke-width="0.5"/>
  <text x="233" y="172" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#06B6D4">-85%</text>
  <text x="233" y="188" font-family="Inter, sans-serif" font-size="9" fill="#52525B">Data Entry Errors</text>

  <!-- Metric 3 -->
  <rect x="411" y="152" width="180" height="45" rx="5" fill="#0A0A0A" stroke="#18181B" stroke-width="0.5"/>
  <text x="426" y="172" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#3B82F6">10x</text>
  <text x="426" y="188" font-family="Inter, sans-serif" font-size="9" fill="#52525B">Faster Shipping</text>

  <!-- Metric 4 -->
  <rect x="604" y="152" width="180" height="45" rx="5" fill="#0A0A0A" stroke="#18181B" stroke-width="0.5"/>
  <text x="619" y="172" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" fill="#8B5CF6">$0</text>
  <text x="619" y="188" font-family="Inter, sans-serif" font-size="9" fill="#52525B">Infrastructure Cost</text>
</svg>
