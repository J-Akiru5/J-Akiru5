<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.3" fill="#27272A"/>
    </pattern>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="420" height="200" rx="8" fill="#0C0C0E" stroke="url(#cardBorder)" stroke-width="1" filter="url(#cardShadow)"/>
  <rect width="420" height="200" rx="8" fill="url(#dots)" opacity="0.5"/>
</svg>
