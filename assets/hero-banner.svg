<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#27272A"/>
    </pattern>
    <pattern id="diagGrid" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#18181B" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="60" y2="0" stroke="#18181B" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Void Background -->
  <rect width="900" height="340" fill="#09090B"/>
  <rect width="900" height="340" fill="url(#dotGrid)"/>
  <rect width="900" height="340" fill="url(#diagGrid)" opacity="0.5"/>

  <!-- Ambient glows -->
  <ellipse cx="450" cy="170" rx="380" ry="130" fill="#3B82F6" opacity="0.03"/>
  <ellipse cx="250" cy="120" rx="200" ry="80" fill="#06B6D4" opacity="0.04"/>
  <ellipse cx="650" cy="200" rx="180" ry="70" fill="#8B5CF6" opacity="0.03"/>

  <!-- Main Glass Card -->
  <rect x="20" y="15" width="860" height="310" rx="14" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Top accent line -->
  <rect x="20" y="15" width="860" height="2" rx="1" fill="url(#accentCyan)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <g stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.5" filter="url(#cyanGlow)">
    <path d="M 20 15 L 20 50" opacity="0.6"/><path d="M 20 15 L 55 15" opacity="0.6"/>
    <path d="M 880 15 L 880 50" opacity="0.6"/><path d="M 880 15 L 845 15" opacity="0.6"/>
    <path d="M 20 325 L 20 290" opacity="0.4"/><path d="M 20 325 L 55 325" opacity="0.4"/>
    <path d="M 880 325 L 880 290" opacity="0.4"/><path d="M 880 325 L 845 325" opacity="0.4"/>
  </g>

  <!-- Left accent bar -->
  <rect x="42" y="45" width="2" height="250" rx="1" fill="#3B82F6" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Active status -->
  <circle cx="65" cy="65" r="4" fill="#10B981">
    <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="65" r="9" fill="#10B981" opacity="0.15">
    <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="82" y="55" width="110" height="20" rx="10" fill="#10B981" opacity="0.1"/>
  <text x="94" y="69" font-family="JetBrains Mono, Courier New, monospace" font-size="9" fill="#10B981" opacity="0.9">● AVAILABLE</text>

  <!-- Name -->
  <text x="62" y="112" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="800" fill="#FAFAFA" letter-spacing="-1">Jeff Edrick Martinez</text>

  <!-- GitHub handle -->
  <text x="62" y="142" font-family="JetBrains Mono, Courier New, monospace" font-size="16" fill="#8B5CF6" letter-spacing="0.5" font-weight="700">@J-Akiru5</text>

  <!-- Title -->
  <text x="62" y="170" font-family="JetBrains Mono, Courier New, monospace" font-size="13" fill="#A1A1AA" letter-spacing="1">Founder &amp; CEO, Syntaxure Labs</text>

  <!-- Tagline -->
  <text x="62" y="202" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#06B6D4" letter-spacing="-0.5">"Governance over Generation"</text>
  <text x="62" y="226" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#52525B" letter-spacing="0.3">Architecting the Workflow of Future AI Development</text>

  <!-- Divider line -->
  <line x1="62" y1="245" x2="850" y2="245" stroke="#27272A" stroke-width="1"/>

  <!-- Terminal Bar -->
  <rect x="62" y="258" width="790" height="40" rx="6" fill="#0A0A0A" stroke="#27272A" stroke-width="1"/>
  <circle cx="78" cy="278" r="4" fill="#EF4444"/><circle cx="92" cy="278" r="4" fill="#F59E0B"/><circle cx="106" cy="278" r="4" fill="#10B981"/>
  <text x="122" y="284" font-family="JetBrains Mono, Courier New, monospace" font-size="11" fill="#A1A1AA">$ gh repo list --owner J-Akiru5 --limit 32</text>
  <text x="535" y="284" font-family="JetBrains Mono, Courier New, monospace" font-size="11" fill="#10B981">[SUCCESS] 32 repositories found</text>
  <rect x="800" y="274" width="6" height="13" rx="1" fill="#10B981">
    <animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom info strip -->
  <rect x="62" y="306" width="790" height="12" rx="3" fill="#0A0A0A" opacity="0.4"/>
  <text x="130" y="315" font-family="JetBrains Mono, Courier New, monospace" font-size="8" fill="#52525B">[INFO] deploy:live  ·  projects:32  ·  open_source:2  ·  stars:80+  ·  language:typescript  ·  [SUCCESS] build_passing</text>

  <!-- Decorative code particles -->
  <g opacity="0.04">
    <text x="760" y="85" font-family="JetBrains Mono, monospace" font-size="11" fill="#06B6D4">&lt;Syntaxure /&gt;</text>
    <text x="730" y="140" font-family="JetBrains Mono, monospace" font-size="9" fill="#3B82F6">const agent = new Prism();</text>
    <text x="740" y="170" font-family="JetBrains Mono, monospace" font-size="8" fill="#8B5CF6">→ protocol.init();</text>
  </g>
</svg>
