<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Contact Syntaxure Labs. Start a project: scope call and fixed quote in 4 hours. Get a quote: fixed price, no retainer. Email jeffmartinez at isufst.edu.ph. Iloilo, Philippines, UTC+8." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#8CA0B3" stroke-opacity=".055" stroke-width="1"/></pattern>
<radialGradient id="bloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 240) rotate(-70) scale(220 420)"><stop stop-color="#8B7BFF" stop-opacity=".14"/><stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/></radialGradient>
<style>
.m{font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.c{fill:#22D3EE}.v{fill:#8B7BFF}.i{fill:#E6EDF3}.d{fill:#8B98A5}.f{fill:#55606B}.g{fill:#34D399}
.r{animation:rise .5s cubic-bezier(0,0,.2,1) both}
.cur{animation:blink 1.06s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.r,.cur{animation:none}}
</style>
</defs>
<rect width="1200" height="240" rx="12" fill="#0A0D12"/>
<rect x="8" y="8" width="1184" height="224" rx="10" fill="#0B1017" stroke="#1C2530"/>
<rect x="8" y="8" width="1184" height="224" rx="10" fill="url(#grid)"/>
<rect x="8" y="8" width="1184" height="224" rx="10" fill="url(#bloom)"/>
<path d="M8 52h1184" stroke="#1C2530"/>
<circle cx="36" cy="30" r="6" fill="#FF5F57" opacity=".9"/>
<circle cx="58" cy="30" r="6" fill="#FEBC2E" opacity=".9"/>
<circle cx="80" cy="30" r="6" fill="#28C840" opacity=".9"/>
<text class="m f" x="600" y="35" font-size="12.5" text-anchor="middle">jeff@syntaxure:~/contact — zsh</text>
<text class="m f" x="1164" y="34" font-size="10.5" text-anchor="end" letter-spacing="1.2">UTC+8</text>
<text class="m r" x="50" y="96" font-size="14"><tspan class="c">$</tspan><tspan class="i" dx="10">syntaxure init --project</tspan><tspan class="f" dx="18"># scope call, fixed quote in 4 hours</tspan></text>
<text class="m r" x="50" y="132" font-size="14" style="animation-delay:.12s"><tspan class="c">$</tspan><tspan class="i" dx="10">syntaxure quote --fixed</tspan><tspan class="f" dx="18"># fixed price, no retainer</tspan></text>
<text class="m r" x="50" y="168" font-size="14" style="animation-delay:.24s"><tspan class="c">$</tspan><tspan class="i" dx="10">mail jeffmartinez@isufst.edu.ph</tspan><tspan class="f" dx="18"># let's talk</tspan></text>
<text class="m r" x="50" y="210" font-size="12.5" style="animation-delay:.36s"><tspan class="g">[READY]</tspan><tspan class="d" dx="9">Iloilo, Philippines · UTC+8 · open to client builds &amp; collaborations</tspan></text>
<rect class="cur" x="1150" y="198" width="9" height="15" fill="#22D3EE" opacity=".8"/>
</svg>
